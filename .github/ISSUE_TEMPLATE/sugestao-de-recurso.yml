name: 💡 Sugestão de recurso
description: Sugira um curso, livro, ferramenta, extensão, projeto real ou comunidade para o guia.
title: "[Recurso]: "
labels: ["sugestão"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela sugestão! Leia os critérios em [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) antes de enviar. Só aceitamos conteúdo legal, com link funcionando e realmente relevante para Apache Wicket.
  - type: input
    id: nome
    attributes:
      label: Nome do recurso
      placeholder: "Ex.: wicket-nome-da-extensão"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options:
        - Roadmap
        - Sites e cursos para aprender Wicket
        - Documentação oficial
        - Livros
        - Podcasts e palestras
        - Sites e blogs
        - Ferramentas e extensões
        - Projetos práticos e código real
        - IA na prática
        - Carreira e vagas
        - Comunidades
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Por que incluir?
      description: Uma ou duas linhas sobre o que é e por que vale o clique. Diga se é gratuito, pago ou em outro idioma.
    validations:
      required: true
  - type: checkboxes
    id: criterios
    attributes:
      label: Confirmação
      options:
        - label: O link está funcionando e o conteúdo é legal (não é material pirateado).
          required: true
